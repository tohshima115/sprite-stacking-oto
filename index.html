<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Sprite Stacking 王都の箱庭</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; overflow: hidden; touch-action: none; }
      canvas#view { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; outline: none; }
      #hud { position: fixed; left: 8px; top: 8px; color: #e8e8e8; font: 12px/1.45 monospace;
             background: rgba(16,18,28,.65); border-radius: 4px; padding: 5px 8px; white-space: pre; pointer-events: none; z-index: 5; }
      #nav { position: fixed; right: 8px; top: 8px; font: 12px monospace; z-index: 6; background: rgba(0,0,0,.45); padding: 4px 8px; border-radius: 4px; }
      #nav a { color: #9cf; margin-left: 8px; text-decoration: none; }
      #nav a:first-child { margin-left: 0; }
      #nav a:hover { text-decoration: underline; }
      #landmark { position: fixed; left: 50%; top: 14px; transform: translateX(-50%);
                  color: #f4e4c1; font: bold 15px/1.3 sans-serif; letter-spacing: 0.04em;
                  background: rgba(26, 28, 44, 0.86); border: 2px solid #e0b84a; border-radius: 6px;
                  padding: 6px 16px; pointer-events: none; display: none; z-index: 7;
                  box-shadow: 0 3px 10px rgba(0,0,0,0.45); white-space: nowrap; }
      @media (max-width: 1180px) { #landmark { top: 38px; } }
      @media (max-width: 600px) { #landmark { top: 38px; font-size: 13px; padding: 4px 12px; } }
      #minimap { position: fixed; right: 12px; bottom: 12px; width: 144px; height: 144px;
                 border: 2px solid #c9c2b0; border-radius: 6px; background: rgba(20, 24, 32, 0.85);
                 image-rendering: pixelated; display: none; z-index: 6; pointer-events: auto; cursor: pointer; }
      #touch-ui { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 8; }
      @media (pointer: coarse) { #touch-ui { display: block; } }
      body.touch-force #touch-ui { display: block; }
      .touch-pad { position: fixed; left: 16px; bottom: 16px; width: 132px; height: 132px; pointer-events: auto; }
      .touch-actions { position: fixed; right: 16px; bottom: 168px; display: grid; grid-template-columns: 48px 48px; gap: 8px; pointer-events: auto; }
      .tbtn { position: absolute; width: 42px; height: 42px; border: 1px solid rgba(255,255,255,0.4); border-radius: 8px;
              background: rgba(26,28,44,0.72); color: #f4e4c1; font: bold 16px sans-serif;
              display: flex; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none; }
      .touch-actions .tbtn { position: static; width: 48px; height: 40px; font-size: 13px; }
      .tbtn:active { background: rgba(224,184,74,0.55); }
    </style>
  </head>
  <body>
    <canvas id="view" tabindex="0"></canvas>
    <div id="hud"></div>
    <div id="landmark"></div>
    <canvas id="minimap" width="144" height="144"></canvas>
    <div id="nav">
      <a href="?scene=oto">oto</a>
      <a href="?scene=single">single</a>
      <a href="?scene=few">few</a>
      <a href="?scene=stress&n=400">stress</a>
    </div>
    <div id="touch-ui">
      <div class="touch-pad">
        <button class="tbtn" data-key="KeyW" style="left:45px;top:0">▲</button>
        <button class="tbtn" data-key="KeyA" style="left:0;top:45px">◀</button>
        <button class="tbtn" data-key="KeyD" style="left:90px;top:45px">▶</button>
        <button class="tbtn" data-key="KeyS" style="left:45px;top:90px">▼</button>
      </div>
      <div class="touch-actions">
        <button class="tbtn" data-key="KeyQ">↺Q</button>
        <button class="tbtn" data-key="KeyE">E↻</button>
        <button class="tbtn" data-tap="KeyZ">+</button>
        <button class="tbtn" data-tap="KeyX">-</button>
        <button class="tbtn" data-key="ShiftLeft" style="grid-column:span 2;width:104px">ダッシュ</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
